<title>ぜんぶちぎる</title>

<style>
/* 机の上の文房具。半券・インデックスタブ・メジャー・真鍮の天秤。色は紙とインク、券の印刷色、金だけ。 */
:root{
  --desk:#c9a57a;
  --paper:#fbf6ea;
  --paper2:#efe6d4;
  --ink:#3a2f25;
  --muted:#7d6b57;
  --red:#e2574c;
  --gold:#e5b53a;
  --pop:"Mochiy Pop One","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--desk);color:var(--ink);font-family:var(--body);overscroll-behavior:none;overflow:hidden}
body{display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:440px;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#app text{font-family:var(--pop)}
#app text.b{font-family:var(--body);font-weight:900}

/* ---- HUD ---- */
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:stretch;gap:8px;pointer-events:none;z-index:2}
.stub{position:relative;background:var(--paper);padding:8px 16px 8px 12px;border-radius:6px;box-shadow:3px 4px 0 rgba(70,45,20,.22);display:flex;flex-direction:column;justify-content:center;min-width:118px}
.stub::after{content:"";position:absolute;right:5px;top:6px;bottom:6px;border-right:2px dotted #cdbb9c}
.stub::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red);border-radius:6px 0 0 6px}
.lbl{font-size:10.5px;font-weight:900;color:var(--muted);letter-spacing:.04em}
.row{display:flex;align-items:baseline;gap:4px}
.odo{display:inline-flex;font-family:var(--pop);font-size:24px;line-height:1;height:1em;overflow:hidden;font-variant-numeric:tabular-nums}
.odo .d{display:inline-block;height:1em;overflow:hidden}
.odo .s{display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,1.3,.4,1)}
.odo .s span{height:1em;line-height:1}
.odo .c{width:.3em;text-align:center}
.unit{font-weight:900;font-size:12px}
.sub{font-size:11.5px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.earth{background:var(--paper);border-radius:6px;padding:8px 10px;box-shadow:3px 4px 0 rgba(70,45,20,.22);display:flex;gap:8px;align-items:center;flex:1;max-width:210px}
.earth svg{flex:none}
.earth .km{font-family:var(--pop);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{position:relative;height:6px;background:#eadfca;border-radius:3px;margin-top:5px}
.track i{position:absolute;left:0;top:0;bottom:0;width:0;background:#4a8f6a;border-radius:3px}
.track b{position:absolute;top:-4px;width:3px;height:14px;background:var(--ink);border-radius:2px;left:0}
.pct{font-size:10px;font-weight:900;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}

/* ---- メモ紙（節目） ---- */
#toast{position:absolute;left:50%;top:96px;transform:translate(-50%,-30px) rotate(-3deg);background:#fffbe6;color:var(--ink);font-weight:900;font-size:14px;padding:12px 18px 10px;box-shadow:3px 5px 0 rgba(70,45,20,.2);opacity:0;white-space:nowrap;z-index:3;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1)}
#toast::before{content:"";position:absolute;top:-8px;left:50%;margin-left:-28px;width:56px;height:16px;background:rgba(159,211,199,.85);transform:rotate(4deg)}
#toast small{display:block;font-size:10.5px;color:var(--muted)}
#toast.on{opacity:1;transform:translate(-50%,0) rotate(-3deg)}

/* ---- 行き先の画面 ---- */
#vw{z-index:4}
#vw.in{animation:vin .32s cubic-bezier(.2,1,.3,1)}
@keyframes vin{from{opacity:0;transform:translateY(18px)}}

/* ---- インデックスタブ ---- */
#tabs{position:absolute;left:0;right:0;bottom:0;height:74px;display:flex;align-items:flex-end;gap:6px;padding:0 10px;z-index:6;pointer-events:none}
#tabs::before{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--paper2);box-shadow:0 -3px 0 rgba(70,45,20,.12)}
#tabs button{pointer-events:auto;position:relative;flex:1;height:58px;border:none;border-radius:14px 14px 0 0;padding:6px 4px 14px;color:var(--ink);font-family:var(--pop);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transform:translateY(8px);transition:transform .2s cubic-bezier(.2,1.4,.4,1),background .2s;box-shadow:2px -2px 0 rgba(70,45,20,.12)}
#tabs button[data-v="tear"]{background:#f6d8d4}
#tabs button[data-v="len"]{background:#f8ecc2}
#tabs button[data-v="wt"]{background:#d9eadf}
#tabs button[data-v="shop"]{background:#dfe3f0}
#tabs button{font-size:11px;gap:1px;flex-direction:column;padding:5px 2px 12px}
#tabs button[data-v="time"]{background:#efd9e6}
#paperSw{position:absolute;right:10px;top:84px;z-index:2;display:none;background:var(--paper);border-radius:999px;padding:3px;box-shadow:2px 3px 0 rgba(70,45,20,.2);gap:2px}
#paperSw button{border:none;background:transparent;border-radius:999px;padding:5px 11px;font-family:var(--pop);font-size:11.5px;color:var(--muted);cursor:pointer}
#paperSw button.on{background:var(--ink);color:var(--paper)}
.coinchip{position:absolute;left:10px;top:84px;z-index:2;pointer-events:none;background:var(--paper);border-radius:999px;padding:4px 10px 4px 6px;box-shadow:2px 3px 0 rgba(70,45,20,.2);font-weight:900;font-size:12px;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.coinchip i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f8dc86,#d9a93a);box-shadow:inset 0 0 0 1.5px #a87a1e}
.coinchip span{font-family:var(--pop);font-size:14px}
#glow{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 0 6px var(--gc,#e5b53a),inset 0 0 40px 10px var(--gc,#e5b53a);animation:gl 1s ease-in-out infinite}
#glow.on{opacity:.55}
@keyframes gl{50%{filter:brightness(1.3);box-shadow:inset 0 0 0 8px var(--gc,#e5b53a),inset 0 0 60px 16px var(--gc,#e5b53a)}}
#buffs{position:absolute;left:10px;top:114px;z-index:2;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.bf{background:var(--paper);border-radius:8px;padding:4px 8px 5px;box-shadow:2px 3px 0 rgba(70,45,20,.2);font-weight:900;font-size:11px;min-width:168px;border-left:5px solid var(--c)}
.bf b{font-family:var(--pop);font-weight:400;float:right;margin-left:10px;font-variant-numeric:tabular-nums}
.bf i{display:block;height:4px;border-radius:2px;background:var(--c);margin-top:3px;transition:width .2s linear}
@media (prefers-reduced-motion:reduce){#glow{animation:none}}
#tabs button.on{transform:translateY(0);background:var(--paper2)}
#tabs button svg{flex:none}
#tabs button:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
#tabs .dot{position:absolute;top:6px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--paper)}
@media (prefers-reduced-motion:reduce){#toast,#tabs button,.odo .s{transition:none}#vw.in{animation:none}}
/* ---- タイトル ---- */
#splash{position:absolute;inset:0;z-index:20;background:var(--desk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;touch-action:none}
#splash::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,240,210,.45),transparent 60%);pointer-events:none}
#spSvg{position:relative;width:min(82%,340px);height:auto;overflow:visible;animation:spIn .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes spIn{from{opacity:0;transform:translateY(-24px) rotate(-4deg)}}
.sp-tap{position:relative;font-family:var(--pop);font-size:15px;color:var(--ink);background:var(--paper);padding:9px 18px 8px;border-radius:999px;box-shadow:2px 3px 0 rgba(70,45,20,.22);animation:spB 1.4s ease-in-out infinite}
@keyframes spB{50%{transform:translateY(-4px)}}
.sp-cnt{position:relative;font-weight:900;font-size:12px;color:#5b4a38;min-height:1em}
#splash.out{animation:spOut .45s .25s ease-in forwards;pointer-events:none}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#spSvg,.sp-tap{animation:none}}
</style>
</head>

<script>
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('sv');
const X0=50,X1=310,WD=X1-X0,LINE=400,H=110,HOLE=9,TICKET_M=0.11,EARTH_KM=40075,GRAM=0.5;
const S=(t,a,p)=>{const e=document.createElementNS(NS,t);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const T=(p,x,y,s,size,a)=>{const t=S('text',Object.assign({x,y,'font-size':size,'text-anchor':'middle','dominant-baseline':'central'},a||{}),p);t.textContent=s;return t};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let uid=0;
function anim(el,kf,d,o){try{el.style.transformBox='fill-box';el.style.transformOrigin='center';return el.animate(kf,Object.assign({duration:d,easing:'ease-out'},o||{}))}catch(e){}}

/* ---------- sound ---------- */
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
let NB=null;function nbuf(){if(NB||!AC)return NB;const n=Math.floor(AC.sampleRate*.4);NB=AC.createBuffer(1,n,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return NB}
function noise(dur,vol,freq,q){const a=AC;if(!a||a.state!=='running')return;try{const s=a.createBufferSource();s.buffer=nbuf();const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;const g=a.createGain(),t=a.currentTime;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(f).connect(g).connect(a.destination);s.start(t,Math.random()*.3,dur+.02)}catch(e){}}
function tone(f,dur,type,vol,slide){const a=AC;if(!a||a.state!=='running')return;try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
const MAJOR=[0,2,4,5,7,9,11],SOLF=['ド','レ','ミ','ファ','ソ','ラ','シ'],NOTE_CAP=14;
const step=c=>Math.min(Math.max(c-1,0),NOTE_CAP); // 1回目=ド、1つずつ上がって2オクターブ上のドで頭打ち
const note=k=>523.25*Math.pow(2,(MAJOR[k%7]+12*Math.floor(k/7))/12);
const solf=k=>SOLF[k%7];
const sfx={
  hole:c=>noise(.022,.32,3200+Math.random()*900+Math.min(c,30)*60,4),
  strain:()=>noise(.03,.12,900,2),
  done:c=>{const k=step(c);noise(.12,.35,5200,.8);voice(note(k),1);if(k===NOTE_CAP){voice(note(k-3),.5);voice(note(k-5),.4)}},
  punch:()=>{noise(.03,.55,6200,3);tone(1800,.035,'square',.03);tone(320,.04,'sine',.12,.6)},
